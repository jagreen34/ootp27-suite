# ═══════════════════════════════════════════════════════════════════════════
# ootp27-suite — five services, one shared registry spine.
#
#   :8502  /27/      ootp27-suite   full Suite        ⚠ LEGACY, see note below
#   :8503  /rank/    ootp-rank      Player Rank       ✅ registry v15.45
#   :8504  /lineup/  ootp-lineup    Lineup Optimizer  ✅ registry v15.45
#   :8505  /card/    ootp-card      The Card          ✅ A101-A105, locked 2026-08-26
#   :8506  /analyze/ ootp-analyze   Export Analyser   ✅ registry v16, A1-A115
#
# ⚠ THE FIRST FOUR build from the REPO ROOT context, so dev_constants.py,
# dev_model.py, quakers.py and draft_board.py land at /app in every image. There is
# exactly ONE copy of every registry constant. /rank/, /lineup/ and /card/ read from
# them and hold no private coefficients, so they cannot drift from each other or from
# the registry. ootp-analyze is the exception — see its own note below.
#
# ⚠ THE SUITE (:8502) IS A VERSION BEHIND ON BATTER VALUE. acquisitions.off_f1
# runs the pre-A57 OLS weights (POW 6.8 / EYE 4.9 / BABIP 3.2 / GAP 1.6 /
# AVK 1.4), its ZR_MODELS drop TDP and over-weight arm (pre-A58), and
# park_fit.py still carries A22's refuted concave POW quadratic. It is fenced,
# not fixed -- deliberately, because porting 3,799 lines to repair tools that
# are not currently in use is the failure mode that took the suite down three
# times. DO NOT compare a number from :8502 against one from :8503 / :8504.
# ═══════════════════════════════════════════════════════════════════════════
services:
  ootp27-suite:
    build: .
    container_name: ootp27-suite
    ports:
      - "8502:8501"
    volumes:
      - ootp27_data:/app/data
    restart: unless-stopped
    environment:
      - OOTP_DATA_DIR=/app/data
      - APP_PASSWORD=${APP_PASSWORD:?set APP_PASSWORD in .env}

  ootp-rank:
    build:
      context: .
      dockerfile: rank/Dockerfile
    container_name: ootp-rank
    ports:
      - "8503:8501"
    volumes:
      - ootp_uploads:/app/data
    restart: unless-stopped
    environment:
      - OOTP_DATA_DIR=/app/data
      - APP_PASSWORD=${APP_PASSWORD:?set APP_PASSWORD in .env}

  ootp-lineup:
    build:
      context: .
      dockerfile: lineup/Dockerfile
    container_name: ootp-lineup
    ports:
      - "8504:8501"
    volumes:
      - ootp_uploads:/app/data
    restart: unless-stopped
    environment:
      - OOTP_DATA_DIR=/app/data
      - APP_PASSWORD=${APP_PASSWORD:?set APP_PASSWORD in .env}

  # ── THE CARD (:8505) ───────────────────────────────────────────────────────
  # Applies the locked rules from A101-A105: top-quartile bars, glove gates,
  # pitcher floors, and the A104 draft-day E[WAR] models. Holds NO coefficients
  # of its own -- it imports quakers.py and draft_board.py from the repo root,
  # which are the same files run from the command line and checked by
  # verify_draftday.py. One constant, one place, three call sites.
  ootp-card:
    build:
      context: .
      dockerfile: card/Dockerfile
    container_name: ootp-card
    ports:
      - "8505:8501"
    volumes:
      - ootp_uploads:/app/data
    restart: unless-stopped
    environment:
      - OOTP_DATA_DIR=/app/data
      - APP_PASSWORD=${APP_PASSWORD:?set APP_PASSWORD in .env}

  # ── ANALYZE (:8506) ────────────────────────────────────────────────────────
  # ⚠ THE ONE SERVICE THAT DOES NOT BUILD FROM THE REPO ROOT. analyze/Dockerfile
  # copies only ootp_analyze.py and app.py, so the build context is ./analyze.
  # That means ootp_analyze.py carries its OWN copy of the registry constants --
  # it does not import dev_constants.py. The guard is the 63-check self-test that
  # runs at BUILD time (RUN python3 ootp_analyze.py verify): a constant that has
  # drifted from the registry stops the build and nothing ships.
  #
  # ⚠ No APP_PASSWORD. This app has no auth of its own -- /analyze/ is protected
  # by nginx basic auth (auth_basic, /etc/nginx/.htpasswd-analyze) in
  # /etc/nginx/snippets/analyze.conf. If that snippet is ever removed the app is
  # open to anyone with the URL.
  #
  # ⚠ Bound to 127.0.0.1 only, unlike the other four. nginx is the sole way in.
  ootp-analyze:
    build: ./analyze
    container_name: ootp-analyze
    restart: unless-stopped
    ports:
      - "127.0.0.1:8506:8506"      # localhost only -- nginx is the way in
    healthcheck:
      test: ["CMD","python3","-c","import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8506/healthz').status==200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3

volumes:
  ootp27_data:
    driver: local
  # Shared upload cache for /rank/, /lineup/ and /card/. ALL THREE mount it at
  # /app/data, so a roster uploaded in one tool is immediately offered in the
  # others -- drop the export once after a sim, use it everywhere. The Suite
  # keeps its own separate ootp27_data volume -- deliberately, since it is
  # fenced at pre-A57 weights and must not share state with the current tools.
  #
  # /analyze/ mounts NEITHER. It stores nothing: the upload goes to a temp
  # directory that is deleted when the request ends.
  ootp_uploads:
    driver: local
